<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="800" height="44" fill="#0d0d0f" fill-opacity="0.9"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Window controls -->
  <circle cx="24" cy="22" r="5" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="40" cy="22" r="5" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="56" cy="22" r="5" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Title -->
  <text x="80" y="27" fill="#ffffff" fill-opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600">The Horizon &middot; Hardware &amp; Sound Lab</text>

  <!-- Ambient Concentric Sonic Circles -->
  <circle cx="400" cy="250" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="400" cy="250" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="400" cy="250" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="45" fill="url(#circleGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Waveform / Spectrum Bars in center -->
  <g transform="translate(180, 250)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3"/>
    <line x1="16" y1="-25" x2="16" y2="25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="32" y1="-45" x2="32" y2="45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="48" y1="-20" x2="48" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="64" y1="-60" x2="64" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="80" y1="-35" x2="80" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="96" y1="-80" x2="96" y2="80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <line x1="112" y1="-50" x2="112" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="128" y1="-20" x2="128" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
    
    <!-- mirrored right side -->
    <line x1="312" y1="-20" x2="312" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="328" y1="-50" x2="328" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="344" y1="-80" x2="344" y2="80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <line x1="360" y1="-35" x2="360" y2="35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="376" y1="-60" x2="376" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="392" y1="-20" x2="392" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="408" y1="-45" x2="408" y2="45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <line x1="424" y1="-25" x2="424" y2="25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <line x1="440" y1="-10" x2="440" y2="10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.3"/>
  </g>

  <!-- Left Float Card -->
  <rect x="50" y="80" width="140" height="150" rx="16" fill="#15161b" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="68" y="98" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="120" cy="165" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <circle cx="120" cy="165" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-dasharray="50 120"/>

  <!-- Right Float Card -->
  <rect x="610" y="270" width="140" height="150" rx="16" fill="#15161b" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="628" y="288" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="628" y="316" width="104" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="628" y="344" width="104" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="628" y="372" width="104" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Bottom Dial Bar -->
  <rect x="180" y="420" width="440" height="52" rx="16" fill="#15161b" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="230" cy="446" r="12" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="340" cy="446" r="12" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="450" cy="446" r="12" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="560" cy="446" r="12" fill="#ffffff" fill-opacity="0.1"/>
</svg>
