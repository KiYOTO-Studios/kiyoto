<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222226" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#131316" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>

  <!-- Subtle Canvas Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>

    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="800" height="44" fill="#0d0d0f" fill-opacity="0.9"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Window controls -->
  <circle cx="24" cy="22" r="5" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="40" cy="22" r="5" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="56" cy="22" r="5" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Search / Command pill -->
  <rect x="260" y="10" width="280" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="360" y="26" fill="#888890" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" letter-spacing="0.04em">Search or prompt...</text>

  <!-- Left Sidebar / Tool Palette -->
  <rect x="16" y="60" width="56" height="420" rx="14" fill="#111114" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="44" cy="94" r="14" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="34" y="130" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="34" y="166" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="34" y="202" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="34" y="238" width="20" height="20" rx="6" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Central Creative Canvas Card -->
  <rect x="96" y="68" width="460" height="340" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
  
  <!-- Canvas Inner Elements -->
  <rect x="120" y="92" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="120" y="114" width="220" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Fluid wave graphic inside card -->
  <path d="M 120 280 C 180 200, 240 320, 310 240 C 370 170, 440 280, 520 210 L 520 370 L 120 370 Z" fill="url(#accent1)" opacity="0.35"/>
  <path d="M 120 280 C 180 200, 240 320, 310 240 C 370 170, 440 280, 520 210" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="310" cy="240" r="6" fill="#ffffff"/>
  <circle cx="310" cy="240" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.4"/>

  <!-- Right Inspector Panel -->
  <rect x="576" y="68" width="208" height="404" rx="18" fill="#111114" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="600" y="94" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <rect x="600" y="124" width="160" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="600" y="172" width="160" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
  <rect x="600" y="220" width="160" height="80" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- Bottom Timeline / Transport bar -->
  <rect x="96" y="424" width="460" height="48" rx="14" fill="#111114" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="124" cy="448" r="10" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="150" y="445" width="380" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="150" y="445" width="190" height="6" rx="3" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="340" cy="448" r="6" fill="#ffffff"/>

  <!-- Badge watermark -->
  <rect x="680" y="16" width="96" height="20" rx="10" fill="#ffffff" fill-opacity="0.08"/>
  <text x="696" y="30" fill="#ffffff" fill-opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.08em">STUDIO V1</text>
</svg>
